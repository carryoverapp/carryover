<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Carryover: one memory for all your AIs</title>
    <meta name="description" content="Carryover brings your Claude, ChatGPT, Claude Code, Codex and Antigravity chats into one private memory graph on your own computer. Free, local-first, no API keys." />
    <meta name="theme-color" content="#0b1220" />
    <meta property="og:title" content="Carryover: one memory for all your AIs" />
    <meta property="og:description" content="Your AI chats from every app in one private memory graph. Free, local-first, no API keys." />
    <meta property="og:image" content="https://farazahmadnagrami.github.io/carryover-app/og.png" />
    <meta property="og:url" content="https://farazahmadnagrami.github.io/carryover-app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/carryover-app/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint, so there's no flash.
      (function () {
        var t = "system";
        try { t = localStorage.getItem("carryover-theme") || "system"; } catch (e) {}
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
